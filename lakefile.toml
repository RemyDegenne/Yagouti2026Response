name = "AlphaRAR"
defaultTargets = ["AlphaRAR"]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# LMLExplore's settings, which ForLMLExplore/ must meet. The two long-file options must agree, or
# the linter asks for a `set_option` in every short file.
weak.linter.style.header = true
weak.linter.style.longFile = 1500
weak.linter.style.longFileDefValue = 1500

# LMLExplore brings Mathlib, Tau Ceti and LML at the versions it pins: never require them here.
[[require]]
name = "LMLExplore"
git = "https://github.com/LeanMachineLearning/LMLExplore"
rev = "main"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "TrustAnnotations"
git = "https://github.com/LeanTrustBuilders/annotations"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "AlphaRAR"

# Comparator (https://github.com/leanprover/comparator) challenge/solution modules for the
# headline results listed in formalization.yaml; see comparator/README.md. One library with a
# stub root: tools that import every library root (checkdecls, referee) must not load the
# challenge modules, which redeclare project and LML names, so those are globs, not roots.
[[lean_lib]]
name = "Comparator"
srcDir = "comparator"
leanOptions = { weak.linter.mathlibStandardSet = false, weak.linter.style.header = false }
globs = [
  "Comparator",
  "Solution",
  "Challenge_aRTS_LLN",
  "Challenge_aRTS_clt_joint",
  "Challenge_aRTS_prop_dev",
  "Challenge_aRTS_prop_dev_ae",
  "Challenge_aRTSFE_sparse_clt_of_contDiffAt",
  "Challenge_aRTSFE_sparse_rate",
]
